<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b18">
  <meta name="description" content="التصميم التصوري للصفحة الرياضية من NOVA PLAY">
  <title>الصفحة الرياضية — NOVA PLAY</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #070b18; color: #f5f3f0; font-family: system-ui, sans-serif; }
    main { width: min(100%, 1600px); margin-inline: auto; padding: 24px; }
    h1 { margin: 0 0 16px; font-size: clamp(1.1rem, 2.3vw, 1.7rem); font-weight: 650; }
    img { display: block; width: 100%; height: auto; border: 1px solid #253453; border-radius: 12px; box-shadow: 0 16px 60px #0008, 0 0 32px #b512ff1a; }
    p { color: #aeb8cb; line-height: 1.7; font-size: .95rem; }
    @media (max-width: 600px) { main { padding: 14px; } img { border-radius: 8px; } }
  </style>
</head>
<body>
  <main>
    <h1>الصفحة الرياضية — NOVA PLAY</h1>
    <img src="iptv_neon_sports_page.png" alt="موكاب صفحة رياضية عربية لمنصة NOVA PLAY، بتصميم نيون داكن وقنوات وبطاقات رياضية">
    <p>تصميم تصوري ثابت بدقة 2560×1440؛ لا يتضمن بثاً مباشراً أو عناصر تفاعلية.</p>
  </main>
</body>
</html>
